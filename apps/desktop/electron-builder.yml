# Installers for macOS, Windows and Linux. Signing is driven by environment variables
# that CI fills from secrets (CLAUDE.md, "Commands"); without them a build is unsigned.
# macOS is notarised when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
# Windows is not signed here: CI sends a release's program and installer to SignPath (docs/ops/code-signing.md).
appId: dev.motionhub.studio
productName: OpenMotionStudio
artifactName: OpenMotionStudio-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
# Binaries the app runs as processes cannot be read from inside the archive, nor can esbuild read three.js there,
# which it bundles into a film that imports it (src/main/film/film.ts).
asarUnpack:
  - '**/node_modules/esbuild/**'
  - '**/node_modules/@esbuild/**'
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/three/**'
  # The headless Chrome the Studio draws its stills and exports in (scripts/fetch-chrome.mjs, ADR 0021).
  - 'resources/chrome/**'
npmRebuild: false
# The Studio's eased-square icon (resources/icon.svg, docs/design.md): a 1024 px picture electron-builder turns
# into the .icns and Linux's PNGs, and for Windows an .ico of 16 to 256 px. The window takes the same files
# (src/main/index.ts).
icon: resources/icon.png
# A film file (.oms, ADR 0019) opens in the Studio, which takes it in as Home's Import does (src/main/index.ts). Its
# document icon is the Studio's tile on a page, build/oms.ico and build/oms.icns. The name is Windows's ProgID and
# macOS's document type; the description is what Explorer and Linux call the kind of file.
fileAssociations:
  - ext: oms
    name: OpenMotionStudio film
    description: OpenMotionStudio film
    mimeType: application/vnd.openmotionstudio.film
    role: Editor
    rank: Owner
    icon: oms
# Generate update metadata with --publish never. CI attaches it to the draft release.
publish:
  provider: github
  owner: motionhubdev
  repo: openmotionstudio
mac:
  category: public.app-category.video
  hardenedRuntime: true
  target: [dmg, zip]
  # The Studio declares the film file's type, so Finder names its kind and shows its icon.
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: dev.motionhub.studio.film
        UTTypeDescription: OpenMotionStudio film
        UTTypeConformsTo: [public.data]
        UTTypeIconFile: oms.icns
        UTTypeTagSpecification:
          public.filename-extension: [oms]
          public.mime-type: [application/vnd.openmotionstudio.film]
win:
  icon: resources/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
linux:
  category: AudioVideo
  target: [AppImage, tar.gz]
  # The desktop file names the film file's type, but neither target installs what *.oms is: this file says it, for
  # the person to install with xdg-mime (docs/tech/creator-workflow.md).
  extraResources:
    - from: build/openmotionstudio-film.xml
      to: openmotionstudio-film.xml
