# Tells the website about a published release. openmotion.studio is kept in the private
# motionhubdev/openmotionstudio-web; when a release is published here, this sends it a `studio-release` dispatch with
# the version, and its Site workflow points the downloads at that release, commits that and deploys.
# Needs the WEBSITE_DISPATCH_TOKEN secret: a fine-grained token with Contents read and write on
# motionhubdev/openmotionstudio-web alone.
name: Site

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The published release to point the website at (v0.1.4)
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Send the release to the website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::The WEBSITE_DISPATCH_TOKEN secret is not set"; exit 1; fi
          gh api repos/motionhubdev/openmotionstudio-web/dispatches \
            -f event_type=studio-release -f "client_payload[version]=$VERSION"
